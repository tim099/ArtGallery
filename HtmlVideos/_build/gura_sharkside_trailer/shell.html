<!-- ── 方舷放置 Sharkside 宣傳片的播放器外殼（splice.py 插在 </body> 前；移植自 kaguya 的 Blockside 宣傳片 shell.html）──
     配色照 Sharkside src/idle.css：深海 #061220、海 #4fd1ff／#2b8bd6、金 #ffd166、珊瑚 #ff6b6b、字 #e8f4ff。沒有可以拖的時間軸（只往前播、播完重播）。 -->
<style id="trStyle">
  body.trailer{ background:#000; }
  /* 核心的舞台照 16:9 置中（字幕與構圖是照 16:9 排的）；核心自己的 HUD、選單、說明一律收起來 */
  body.trailer #stage{ top:50%; left:50%; right:auto; bottom:auto; width:min(100vw, calc(100vh * 16 / 9)); height:auto; aspect-ratio:16/9; transform:translate(-50%,-50%); }
  body.trailer #stage > :not(#cv){ display:none !important; }
  body.trailer #cv{ cursor:default; }
  #trUI{ display:none; }
  body.trailer #trUI{ display:block; position:fixed; top:50%; left:50%; width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16/9; transform:translate(-50%,-50%); z-index:100;
    font-family:system-ui,"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; color:#e8f4ff; user-select:none; }
  /* ⛔ 核心的全域 canvas 規則（absolute、crosshair、touch-action:none）也會套到字幕層 ⇒ 這裡蓋掉 */
  #trUI canvas#trCap{ position:absolute; inset:0; width:100%; height:100%; cursor:default; touch-action:auto; pointer-events:none; }
  #trUI .trLoad, #trUI .trCover{ position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:18px; }
  #trUI .trLoad{ background:radial-gradient(ellipse at 50% 35%, #0d2c4a 0%, #061220 70%); display:flex; }
  #trUI .trLoad .t{ font-size:clamp(28px,5vw,64px); font-weight:800; letter-spacing:.3em; color:#e8f4ff; padding-left:.3em; text-shadow:0 0 24px rgba(79,209,255,.45); }
  #trUI .trLoad .bar{ width:min(60%,520px); height:4px; background:rgba(130,205,255,.15); border-radius:2px; overflow:hidden; }
  #trUI .trLoad .bar i{ display:block; height:100%; width:0; background:linear-gradient(90deg,#2b8bd6,#4fd1ff); transition:width .3s; }
  #trUI .trLoad .s{ font-size:clamp(11px,1.4vw,15px); color:#8fb0c8; letter-spacing:.08em; text-align:center; padding:0 16px; }
  #trUI .trCover{ background:linear-gradient(180deg, rgba(6,18,32,.55) 0%, rgba(6,18,32,.35) 45%, rgba(4,30,52,.80) 100%), radial-gradient(ellipse at 50% 110%, rgba(43,139,214,.55), rgba(6,18,32,0) 60%); cursor:pointer; gap:2.2vw; }
  #trUI .trCover img{ width:min(54%,620px); height:auto; filter:drop-shadow(0 8px 26px rgba(0,0,0,.55)); }
  #trUI .trCover .play{ width:88px; height:88px; border-radius:50%; border:2px solid #4fd1ff; display:flex; align-items:center; justify-content:center; font-size:34px; color:#4fd1ff; background:rgba(6,18,32,.55);
    box-shadow:0 0 34px rgba(79,209,255,.45); padding-left:6px; box-sizing:border-box; transition:transform .15s, box-shadow .15s; }
  #trUI .trCover:hover .play{ transform:scale(1.06); box-shadow:0 0 44px rgba(79,209,255,.65); }
  #trUI .trCover .hint{ color:#bfe6ff; font-size:clamp(11px,1.4vw,15px); letter-spacing:.12em; text-align:center; padding:0 16px; text-shadow:0 1px 6px rgba(0,0,0,.6); }
  #trUI .trBuf{ display:none; position:absolute; right:14px; top:12px; font-size:13px; color:#bfe6ff; background:rgba(6,18,32,.6); padding:3px 10px; border-radius:10px; }
  #trUI .trBar{ position:absolute; left:0; right:0; bottom:0; display:flex; gap:10px; align-items:center; padding:10px 14px; background:linear-gradient(transparent, rgba(2,10,20,.82)); opacity:0; transition:opacity .25s; }
  #trUI:hover .trBar{ opacity:1; }
  #trUI .trBar button{ background:none; border:1px solid rgba(130,205,255,.35); color:#e8f4ff; border-radius:8px; padding:4px 10px; font-size:14px; cursor:pointer; }
  #trUI .trBar button:hover{ border-color:#4fd1ff; }
  #trUI .trBar .sp{ flex:1; }   /* 沒有可以拖的時間軸（kaguya 那一支 Tim 2026-10-19 拍板的作法：只往前播 ⇒ 船照出場順序邊播邊載），播完能重播就好 */
  #trUI .trBar .time{ font-variant-numeric:tabular-nums; font-size:13px; color:#8fb0c8; min-width:84px; text-align:right; }
  #trUI .trEnd{ position:absolute; left:0; right:0; bottom:16%; display:none; flex-wrap:wrap; justify-content:center; gap:14px; padding:0 16px; }
  #trUI .trEnd .btn{ display:inline-flex; flex-direction:column; align-items:center; gap:4px; text-decoration:none; color:#e8f4ff; background:rgba(6,20,36,.80); border:1px solid #4fd1ff; border-radius:14px; padding:12px 26px;
    font-size:clamp(14px,1.8vw,20px); font-weight:700; cursor:pointer; letter-spacing:.08em; font-family:inherit; }
  #trUI .trEnd .btn:hover{ background:rgba(20,60,100,.88); box-shadow:0 0 22px rgba(79,209,255,.4); }
  #trUI .trEnd .btn.go{ border-color:#ffd166; color:#ffd166; }
  #trUI .trEnd .btn.go:hover{ box-shadow:0 0 22px rgba(255,209,102,.45); }
  #trUI .trEnd .btn small{ font-size:clamp(10px,1.1vw,12px); font-weight:400; color:#8fb0c8; letter-spacing:.04em; }
  #trUI .trHint{ position:absolute; left:50%; bottom:7%; transform:translateX(-50%); background:rgba(2,10,20,.82); border:1px solid rgba(130,205,255,.35); border-radius:10px; padding:8px 14px; font-size:clamp(11px,1.4vw,15px); opacity:0; transition:opacity .3s; pointer-events:none; text-align:center; max-width:90%; }
  #trUI.still .trBar, #trUI.still .trCover, #trUI.still .trBuf, #trUI.still .trHint, #trUI.still .trEnd{ display:none !important; }
</style>
<div id="trUI">
  <canvas id="trCap" width="1920" height="1080"></canvas>
  <div class="trLoad" id="trLoad"><div class="t">方舷放置</div><div class="bar"><i id="trLoadI"></i></div><div class="s" id="trLoadS">準備遊戲引擎…</div></div>
  <div class="trCover" id="trCover"><img id="trLogo" alt="方舷放置 Sharkside"><div class="play">▶</div><div class="hint">方舷放置 Sharkside 宣傳片 · 建議開聲音</div></div>
  <div class="trBuf" id="trBuf">準備中…</div>
  <div class="trEnd" id="trEnd">
    <button class="btn" id="trReplay" type="button">⟲ 重播<small>從頭再看一次</small></button>
    <a class="btn go" id="trTry">▶ 立即遊玩（網頁直接玩）<small id="trURL"></small></a>
  </div>
  <div class="trHint" id="trHint"></div>
  <div class="trBar" id="trBar">
    <button id="trPlay" title="空白鍵">▶</button>
    <span class="sp"></span>
    <span class="time" id="trTime">0:00 / 0:00</span>
    <button id="trMute" title="M">🔊</button>
  </div>
</div>
