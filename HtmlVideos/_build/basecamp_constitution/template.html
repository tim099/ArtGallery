<script>

// ── 階段表：名字、一句話、長度、鏡頭（目標 x,y,z；yaw；pitch；距離；這一段轉幾度）、要不要切開 ──

];

const OUTRO=acc;                      // 123.5

const OUT_CAM=[470,160,250,0,15,1450];
// ── 新圖紙（作品 design/ 底下的設計稿，裁切縮小後嵌在本檔；讀不到就那一層不畫）──
const SHEETS=JSON.parse(document.getElementById('sheets').textContent).map(s=>{s.im=new Image();s.im.onload=()=>{if(!playing)frame(t)};s.im.src=s.src;return s});
function ready(im){return im&&im.complete&&im.naturalWidth>0}

const GROUPS=['骨架','外板','船殼內部','甲板','房間','桅杆與帆桁','船頭船尾與舵','舷側與繫繩點','砲','梯子','繩','帆','海（片尾）'];

// ── DOM ──
const stage=document.getElementById('stage'),glc=document.getElementById('gl'),ov=document.getElementById('ov'),ctx=ov.getContext('2d');
const cover=document.getElementById('cover'),loadEl=document.getElementById('load'),seek=document.getElementById('seek'),timeEl=document.getElementById('time');
const playBtn=document.getElementById('play'),muteBtn=document.getElementById('mute'),partsBtn=document.getElementById('parts'),panel=document.getElementById('panel');
let t=0,playing=false,muted=false,lastNow=0,raf=0,ac=null,master=null;
let levMask=31,mask=(1<<13)-1, cutMode='auto', camMode='auto', free={yaw:70,pitch:18,dist:900};
let D=null;            // 船的資料
let gl=null, P={};     // WebGL 與程式
let glState='pending', pendingPlay=false, res=2, fineState='none';   // res：2 ＝ 0.2 m、1 ＝ 原始 0.1 m   // pending ＝ 資料還在讀；none ＝ 沒有 WebGL2

// ── 鏡頭（自動 ＝ t 的純函數）──
function stepAt(tt){for(let i=STEPS.length-1;i>=0;i--)if(tt>=STEPS[i].t0)return i;return -1}
function camKey(c,local,len){return {x:c[0],y:c[1],z:c[2],yaw:c[3]+(c[6]||0)*clamp(local/len,0,1),pitch:c[4],dist:c[5]}}
function mixCam(a,b,k){return {x:lerp(a.x,b.x,k),y:lerp(a.y,b.y,k),z:lerp(a.z,b.z,k),yaw:lerp(a.yaw,b.yaw,k),pitch:lerp(a.pitch,b.pitch,k),dist:lerp(a.dist,b.dist,k)}}
function autoCam(tt){
  const first=STEPS[0];
  if(tt<INTRO){const k=ease(tt/INTRO);const b=camKey(first.c,0,1);return mixCam({x:420,y:160,z:60,yaw:20,pitch:30,dist:1500},b,k)}

    const last=STEPS[STEPS.length-1],a=camKey(last.c,last.d,last.d),lt=tt-OUTRO,L=launch(tt);
    const side={x:330-L.s*0.85,y:160,z:70+L.dz*0.5,yaw:108,pitch:9,dist:1500};          // 側面、偏船尾，跟著船
    const orb={x:450-L.s,y:160,z:150+L.dz,yaw:108+Math.max(0,lt-14)*11,pitch:13,dist:1550};  // 浮起來以後繞船
    const b=mixCam(a,side,ease(lt/3));
    return mixCam(b,orb,ease((lt-14)/3));
  }
  const i=stepAt(tt),s=STEPS[i],lt=tt-s.t0,cur=camKey(s.c,lt,s.d);
  if(i===0)return cur;
  const p=STEPS[i-1],prev=camKey(p.c,p.d,p.d);
  let dy=cur.yaw-prev.yaw; while(dy>180){cur.yaw-=360;dy-=360} while(dy<-180){cur.yaw+=360;dy+=360}

const NOCUT_Y=340,NOCUT_Z=900;
function cutAuto(tt){                 // 回傳 [y 切面, z 切面]：y 以上（靠鏡頭那一舷）不畫、z 以上不畫
  if(tt<INTRO||tt>=OUTRO)return [NOCUT_Y,NOCUT_Z];
  const i=stepAt(tt),s=STEPS[i],lt=tt-s.t0,p=i>0?STEPS[i-1]:{},k=ease(lt/1.4);
  return [lerp(p.cy||NOCUT_Y,s.cy||NOCUT_Y,k),lerp(p.cz||NOCUT_Z,s.cz||NOCUT_Z,k)];
}
function focusAuto(tt){               // 船裡面那幾段：這一段加的部件原色，其他調暗
  if(tt<INTRO||tt>=OUTRO)return [-1,0];
  const i=stepAt(tt),s=STEPS[i],lt=tt-s.t0,p=i>0?STEPS[i-1]:{},k=ease(lt/1.2);
  const has=s.fo!==undefined,had=p.fo!==undefined;

function camera(tt){

// ── 矩陣 ──
function persp(fov,asp,n,f){const t_=1/Math.tan(fov/2),m=new Float32Array(16);m[0]=t_/asp;m[5]=t_;m[10]=(f+n)/(n-f);m[11]=-1;m[14]=2*f*n/(n-f);return m}

  const y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];
  return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-(x[0]*e[0]+x[1]*e[1]+x[2]*e[2]),-(y[0]*e[0]+y[1]*e[1]+y[2]*e[2]),-(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]),1]);
}
function mul(a,b){const o=new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s}return o}

// ── 著色器 ──
const VS_BOX=`#version 300 es
precision highp float;precision highp int;
layout(location=0) in vec3 aC;layout(location=1) in uint aP;layout(location=2) in uint aCol;
layout(location=3) in uint aSOn;layout(location=4) in uint aSOff;layout(location=5) in float aFOn;layout(location=6) in float aFOff;layout(location=7) in uint aGrp;layout(location=8) in uint aFace;
uniform mat4 uVP,uModel;uniform float uT,uCut,uCutZ,uBuild,uFocusAmt,uScale;uniform float uStart[25];uniform float uLen[25];uniform int uMask,uFocus,uLevMask;
out vec3 vCol;out vec3 vL;out vec3 vW;flat out uint vFace;
void main(){
  uint p=aP;vFace=aFace;float cx=float(p&1023u),cy=float((p>>10u)&511u),cz=float((p>>19u)&1023u);   // 格的座標（0.2 m 那份是粗格座標，乘 uScale）
  // 群組（低 4 位）、在哪一層甲板（高位；0 ＝ 不屬於任何一層）
  int g=int(aGrp&15u),lv=int(aGrp>>4u);bool nopop=((p>>29u)&1u)==1u;bool swp=((p>>30u)&1u)==1u;
  float ton=uStart[int(aSOn)]+uLen[int(aSOn)]*uBuild*aFOn;
  float toff=aSOff==255u?1e9:uStart[int(aSOff)]+uLen[int(aSOff)]*uBuild*aFOff;
  float a=uT-ton,s=1.0,glow=0.0;
  if(!nopop){s=smoothstep(0.0,0.3,a);glow=1.0-smoothstep(0.0,0.9,a);}
  float r=toff-uT;if(!swp&&r<0.3)s*=clamp(r/0.3,0.0,1.0);
  vec3 c=(vec3(cx,cy,cz)+0.5)*uScale;
  bool vis=a>=0.0&&uT<toff&&((uMask>>g)&1)==1&&((uLevMask>>lv)&1)==1&&c.y<=uCut&&c.z<=uCutZ;
  if(!vis||s<=0.001){gl_Position=vec4(2.0,2.0,2.0,1.0);return;}
  vec3 w=c+(aC-0.5)*uScale*s;
  uint ci=aCol;vec3 col=vec3(float((ci>>5u)&7u)/7.0,float((ci>>2u)&7u)/7.0,float(ci&3u)/3.0);

  if(uFocus>=0&&g!=uFocus){float lum=dot(col,vec3(0.3,0.59,0.11));col=mix(col,vec3(lum)*0.45+vec3(0.03,0.04,0.07),uFocusAmt*0.8);}

    const o1=osc('sawtooth',mtof(ev.m),w,end),o2=osc('triangle',mtof(ev.m),w,end,4);lg.connect(o1.detune);lg.connect(o2.detune);
    const g1=ac.createGain();g1.gain.value=0.45;o1.connect(g1);g1.connect(f);o2.connect(f);f.connect(g);g.connect(bus)}
  else if(ev.k==='kick'){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(130,w);o.frequency.exponentialRampToValueAtTime(42,w+0.16);
    g.gain.setValueAtTime(0.0001,w);g.gain.exponentialRampToValueAtTime(ev.v||0.32,w+0.005);g.gain.exponentialRampToValueAtTime(0.0001,w+0.32);o.connect(g);g.connect(bus);o.start(w);o.stop(w+0.35)}
  else if(ev.k==='tamb'){const s=ac.createBufferSource();s.buffer=noise;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=6500;const g=ac.createGain();
    g.gain.setValueAtTime(0.0001,w);g.gain.exponentialRampToValueAtTime(ev.v,w+0.003);g.gain.exponentialRampToValueAtTime(0.0001,w+0.07);s.connect(f);f.connect(g);g.connect(bus);s.start(w,rnd(w)*3);s.stop(w+0.08)}
  else if(ev.k==='knock'){const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();o.type='triangle';o.frequency.setValueAtTime(150+ev.v*110,w);o.frequency.exponentialRampToValueAtTime(70,w+0.09);
    f.type='lowpass';f.frequency.value=900;g.gain.setValueAtTime(0.0001,w);g.gain.exponentialRampToValueAtTime(0.13,w+0.004);g.gain.exponentialRampToValueAtTime(0.0001,w+0.13);o.connect(f);f.connect(g);g.connect(bus);o.start(w);o.stop(w+0.16)}
  else if(ev.k==='bell'){[74,81,86].forEach((m,j)=>{const g=ac.createGain();g.gain.setValueAtTime(0.0001,w);g.gain.exponentialRampToValueAtTime(0.05/(j+1),w+0.01);g.gain.exponentialRampToValueAtTime(0.0001,w+1.8);
      const o=osc('sine',mtof(m-(ev.i===99?12:0)),w,w+1.85);o.connect(g);g.connect(bus)})}
  else if(ev.k==='splash'){const s=ac.createBufferSource();s.buffer=noise;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(2400,w);f.frequency.exponentialRampToValueAtTime(300,w+2.6);
    const g=ac.createGain();g.gain.setValueAtTime(0.0001,w);g.gain.exponentialRampToValueAtTime(0.9,w+0.05);g.gain.exponentialRampToValueAtTime(0.0001,w+2.8);s.connect(f);f.connect(g);g.connect(bus);s.start(w);s.stop(w+2.9);
    const o=ac.createOscillator(),g2=ac.createGain();o.type='sine';o.frequency.setValueAtTime(90,w);o.frequency.exponentialRampToValueAtTime(35,w+0.6);g2.gain.setValueAtTime(0.0001,w);g2.gain.exponentialRampToValueAtTime(0.4,w+0.02);g2.gain.exponentialRampToValueAtTime(0.0001,w+0.9);o.connect(g2);g2.connect(bus);o.start(w);o.stop(w+1)}
  else if(ev.k==='wave'){const s=ac.createBufferSource();s.buffer=noise;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(380,w);f.frequency.linearRampToValueAtTime(900,w+1.1);f.frequency.linearRampToValueAtTime(300,w+3.2);
    const g=ac.createGain();g.gain.setValueAtTime(0.0001,w);g.gain.exponentialRampToValueAtTime(ev.v*2.2,w+1.1);g.gain.exponentialRampToValueAtTime(0.0001,w+3.4);s.connect(f);f.connect(g);g.connect(bus);s.start(w,rnd(w)*0.5);s.stop(w+3.5)}
  else if(ev.k==='whoosh'){const s=ac.createBufferSource();s.buffer=noise;const f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=0.8;f.frequency.setValueAtTime(300,w);f.frequency.exponentialRampToValueAtTime(1400,w+2.2);
    const g=ac.createGain();g.gain.setValueAtTime(0.0001,w);g.gain.exponentialRampToValueAtTime(0.45,w+0.6);g.gain.exponentialRampToValueAtTime(0.0001,w+2.6);s.connect(f);f.connect(g);g.connect(bus);s.start(w);s.stop(w+2.7)}}
// 把 (sched, hi] 之間的事件排進去：事件 t 對應到 現在 ＋ (t − 畫面上的 t)
function schedule(nt){addLaunchEvents();if(!ac||muted){sched=nt+LA;return}const hi=nt+LA,now=ac.currentTime;
  for(const ev of EVENTS){if(ev.t<=sched)continue;if(ev.t>hi)break;fire(ev,now+Math.max(0,ev.t-nt))}sched=hi}
function resync(tt){sched=tt;hush()}

// ── 播放器 ──
function loop(now){if(!playing)return;const dt=Math.min(0.25,(now-lastNow)/1000);lastNow=now;let nt=t+dt;
  if(nt>=DUR){nt=DUR;playing=false;playBtn.textContent='▶'}
  schedule(nt);frame(nt);if(playing)raf=requestAnimationFrame(loop)}
function play(){if(glState==='pending'){pendingPlay=true;loadEl.textContent='讀完就開始…';return}initAudio();if(ac&&ac.state==='suspended')ac.resume();if(t>=DUR)t=0;resync(t);playing=true;cover.style.display='none';playBtn.textContent='⏸';lastNow=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function pause(){playing=false;playBtn.textContent='▶';cancelAnimationFrame(raf);hush()}
function redraw(){if(!playing)frame(t)}
document.getElementById('start').addEventListener('click',play);
playBtn.addEventListener('click',()=>playing?pause():play());
document.getElementById('restart').addEventListener('click',()=>{t=0;frame(0);if(!playing)play();else resync(0)});
seek.addEventListener('input',()=>{frame(parseFloat(seek.value));if(playing)resync(t)});
muteBtn.addEventListener('click',()=>{muted=!muted;muteBtn.setAttribute('aria-pressed',muted);muteBtn.textContent=muted?'靜音中':'聲音';if(master)master.gain.value=muted?0:0.7});
partsBtn.addEventListener('click',()=>{panel.hidden=!panel.hidden;partsBtn.setAttribute('aria-expanded',!panel.hidden)});
const chips=document.getElementById('chips');
GROUPS.forEach((g,i)=>{const b=document.createElement('button');b.textContent=g;b.setAttribute('aria-pressed','true');b.addEventListener('click',()=>{mask^=(1<<i);b.setAttribute('aria-pressed',!!(mask&(1<<i)));redraw()});chips.appendChild(b)});
const LEVELS=['orlop','berth deck','gun deck','spar deck'];
const levEl=document.getElementById('levels');
LEVELS.forEach((nm,i)=>{const b=document.createElement('button');b.textContent=nm;b.setAttribute('aria-pressed','true');b.addEventListener('click',()=>{levMask^=(1<<(i+1));b.setAttribute('aria-pressed',!!(levMask&(1<<(i+1))));redraw()});levEl.appendChild(b)});
function setSeg(ids,on){ids.forEach(id=>document.getElementById(id).setAttribute('aria-pressed',id===on))}
const CUTS=[['cutAuto','auto'],['cutSide','side'],['cutTop','top'],['cutOff','off']];
CUTS.forEach(([id,m])=>document.getElementById(id).addEventListener('click',()=>{cutMode=m;setSeg(CUTS.map(c=>c[0]),id);redraw()}));
function setCam(m){if(m==='free'&&camMode!=='free'){const a=autoCam(t);free={yaw:a.yaw,pitch:a.pitch,dist:a.dist}}camMode=m;setSeg(['camAuto','camFree'],m==='free'?'camFree':'camAuto');redraw()}
function setRes(r){res=r;setSeg(['res2','res1'],r===1?'res1':'res2');if(r===1&&glState==='ok')loadFine();redraw()}
document.getElementById('res2').addEventListener('click',()=>setRes(2));document.getElementById('res1').addEventListener('click',()=>setRes(1));
document.getElementById('camAuto').addEventListener('click',()=>setCam('auto'));document.getElementById('camFree').addEventListener('click',()=>setCam('free'));
document.getElementById('allOn').addEventListener('click',()=>{mask=(1<<13)-1;levMask=31;[...levEl.children].forEach(b=>b.setAttribute('aria-pressed','true'));[...chips.children].forEach(b=>b.setAttribute('aria-pressed','true'));redraw()});
let drag=null;
glc.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};glc.setPointerCapture(e.pointerId)});
glc.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)<2)return;if(camMode!=='free')setCam('free');
  free.yaw-=dx*0.35;free.pitch=clamp(free.pitch+dy*0.25,-5,85);drag={x:e.clientX,y:e.clientY};redraw()});
glc.addEventListener('pointerup',()=>{drag=null});
glc.addEventListener('wheel',e=>{e.preventDefault();if(camMode!=='free')setCam('free');free.dist=clamp(free.dist*Math.exp(e.deltaY*0.001),80,4000);redraw()},{passive:false});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.code!=='Space')return;
  if(e.code==='Space'){e.preventDefault();playing?pause():play()}else if(e.code==='ArrowRight'){frame(t+5);if(playing)resync(t)}else if(e.code==='ArrowLeft'){frame(t-5);if(playing)resync(t)}
  else if(e.code==='KeyM'){muteBtn.click()}else if(e.code==='KeyP'){partsBtn.click()}});

// ?t=<秒> 停在那一格；?still=1 拿掉控制列（縮圖用）
const q=new URLSearchParams(location.search);
if(q.has('t'))t=clamp(parseFloat(q.get('t'))||0,0,DUR);
if(q.get('still')==='1')stage.classList.add('still');
if(q.get('res')==='0.1'){res=1;document.getElementById('res2').setAttribute('aria-pressed','false');document.getElementById('res1').setAttribute('aria-pressed','true')}
if(q.has('t'))cover.style.display='none';
frame(t);
loadData().then(d=>{D=d;let ok=false;try{ok=initGL()}catch(e){console.error(e);gl=null}
  glState=ok?'ok':'none';if(ok&&res===1)loadFine();loadEl.textContent=ok?'':'這個瀏覽器沒有 WebGL2，看不到船。';frame(t);if(pendingPlay)play()}).catch(e=>{console.error(e);glState='none';loadEl.textContent='船的資料讀不出來：'+e.message;frame(t)});
})();
</script>
