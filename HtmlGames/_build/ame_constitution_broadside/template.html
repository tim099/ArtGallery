<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>憲法號對轟 (Constitution Broadside)</title>
<style>
  :root{ --ink:#f3ead8; --dim:#b9ae98; --gold:#e8c26a; --blue:#6f9bff; --red:#ff6f6f; --panel:rgba(14,18,24,.72); }
  html,body{ margin:0; height:100%; background:#0d1218; color:var(--ink); overflow:hidden;
    font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif; }
  #stage{ position:fixed; inset:0; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }
  .hud{ position:absolute; pointer-events:none; font-size:13px; line-height:1.5; text-shadow:0 1px 2px #000; }
  .panel{ background:var(--panel); border:1px solid rgba(255,255,255,.12); border-radius:8px; padding:8px 12px; }
  #me{ left:12px; top:12px; border-left:3px solid var(--blue); }
  #foe{ right:12px; top:12px; border-left:3px solid var(--red); text-align:left; }
  .hud h3{ margin:0 0 2px; font-size:14px; }
  .bar{ height:5px; background:rgba(255,255,255,.15); border-radius:3px; overflow:hidden; margin:2px 0 4px; width:170px; }
  .bar i{ display:block; height:100%; background:var(--gold); }
  .bar.water i{ background:#4fb3d9; }
  #ctl{ left:50%; bottom:12px; transform:translateX(-50%); text-align:center; white-space:nowrap; }
  #ctl b{ color:var(--gold); }
  #ammo span{ display:inline-block; margin:0 4px; padding:1px 8px; border-radius:10px; border:1px solid rgba(255,255,255,.2); color:var(--dim); }
  #ammo span.on{ color:#111; background:var(--gold); border-color:var(--gold); }
  #guns{ margin-top:4px; letter-spacing:1px; font-family:Consolas,monospace; font-size:12px; }
  #msg{ left:50%; top:22%; transform:translateX(-50%); font-size:22px; font-weight:700; text-align:center; opacity:0; transition:opacity .4s; }
  #tip{ left:12px; bottom:12px; color:var(--dim); font-size:12px; }
  #cover{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse at 50% 40%, rgba(20,30,44,.80), rgba(5,8,12,.94)); }
  #cover .card{ max-width:620px; padding:26px 30px; text-align:center; }
  #cover h1{ margin:0 0 4px; font-size:30px; letter-spacing:2px; }
  #cover .sub{ color:var(--dim); margin-bottom:14px; font-size:13px; }
  #cover .row{ margin:10px 0; }
  #cover button{ font:inherit; font-size:15px; margin:4px; padding:7px 16px; border-radius:6px; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.06); color:var(--ink); cursor:pointer; }
  #cover button.on{ background:var(--gold); color:#111; border-color:var(--gold); }
  #cover button.go{ font-size:18px; padding:9px 30px; background:#b8452e; border-color:#e06a4f; }
  #cover button:disabled{ opacity:.4; cursor:wait; }
  #load{ color:var(--dim); font-size:12px; min-height:18px; font-family:Consolas,monospace; white-space:pre-line; }
  #help{ position:absolute; right:12px; bottom:12px; max-width:330px; font-size:12px; display:none; pointer-events:none; }
  #help.on{ display:block; }
  #help kbd{ display:inline-block; min-width:16px; padding:0 4px; border:1px solid rgba(255,255,255,.3); border-radius:3px; font-family:Consolas,monospace; text-align:center; }
  #end{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.45); }
  #end.on{ display:flex; }
  #end .card{ text-align:center; padding:22px 30px; }
  #end h2{ margin:0 0 8px; font-size:26px; }
  #end button{ font:inherit; margin:10px 6px 0; padding:6px 18px; border-radius:6px; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.08); color:var(--ink); cursor:pointer; }
  .still .hud, .still #cover, .still #help, .still #end{ display:none !important; }
  #err{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); max-width:80%; color:#ffb3a6; display:none; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="me" class="hud panel"></div>
  <div id="foe" class="hud panel"></div>
  <div id="ctl" class="hud panel">
    <div id="ammo"><span data-a="0">1 實心彈</span><span data-a="1">2 爆裂彈</span><span data-a="2">3 鏈彈</span></div>
    <div id="guns"></div>
    <div><b>左鍵</b> 點敵艦瞄準　<b>空白鍵</b> 齊射　<b>F</b> 單門　<b>H</b> 說明</div>
  </div>
  <div id="msg" class="hud"></div>
  <div id="tip" class="hud"></div>
  <div id="help" class="hud panel">
    <div><kbd>左鍵</kbd> 點敵艦：設瞄準點（拖曳＝轉鏡頭）</div>
    <div><kbd>右鍵</kbd> 拖曳：平移　<kbd>滾輪</kbd> 遠近</div>
    <div><kbd>空白</kbd> 齊射（裝填好的砲依序開火）　<kbd>F</kbd> 開一門</div>
    <div><kbd>1</kbd> 實心彈：鑽得深，打水線讓船進水</div>
    <div><kbd>2</kbd> 爆裂彈：炸開大洞，但不深</div>
    <div><kbd>3</kbd> 鏈彈：橫掃一片，專打桅杆、繩與帆</div>
    <div><kbd>C</kbd> 鏡頭：自由／追砲彈／看敵艦／看我艦</div>
    <div><kbd>P</kbd> 暫停　<kbd>M</kbd> 靜音　<kbd>R</kbd> 回選單</div>
  </div>

  <div id="cover">
    <div class="card panel">
      <h1>憲法號對轟</h1>
      <div class="sub">Constitution Broadside —— 兩艘 1:1 的憲法號（0.1 公尺一格）互轟，船殼一格一格被打碎、桅杆打得斷、破洞進水會沉。<br>
        素材：basecamp 的雕刻作品《憲法號（組裝）》</div>
      <div class="row" id="modes">
        <button data-m="pve" class="on">對戰電腦</button><button data-m="eve">電腦對電腦（觀戰）</button><button data-m="sandbox">沙盒（敵艦不還手）</button>
      </div>
      <div class="row" id="dists">距離
        <button data-d="90">90 m</button><button data-d="140" class="on">140 m</button><button data-d="220">220 m</button>
      </div>
      <div class="row"><button class="go" id="go" disabled>載入中…</button></div>
      <div id="load"></div>
    </div>
  </div>
  <div id="end"><div class="card panel"><h2 id="endT"></h2><div id="endS"></div>
    <button id="endC">繼續看</button><button id="endR">回選單</button></div></div>
  <div id="err"></div>
</div>

<script src="../../../VoxelKit/voxelkit.js"></script>
<script type="application/x-vxk" id="ship" src="../../../VoxelKit/_cache/constitution.vxk"></script>
<script src="game.js"></script>
</body>
</html>
